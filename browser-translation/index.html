<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vcall-seamless Translation Browser Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 1000px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .config-section {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .config-group {
        margin-bottom: 15px;
      }

      .config-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input[type='text'],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
      }

      input[type='text']:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .language-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .translator-section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 30px;
      }

      .translator-panel {
        display: flex;
        flex-direction: column;
      }

      .panel-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 12px;
        font-size: 16px;
      }

      textarea {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        min-height: 150px;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-primary {
        background: #667eea;
        color: white;
        flex: 1;
      }

      .btn-primary:hover:not(:disabled) {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #e0e0e0;
        color: #333;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #d0d0d0;
      }

      .status {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status.idle {
        background: #e3f2fd;
        color: #1976d2;
      }

      .status.translating {
        background: #fff3e0;
        color: #f57c00;
      }

      .status.success {
        background: #e8f5e9;
        color: #388e3c;
      }

      .status.error {
        background: #ffebee;
        color: #c62828;
      }

      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .status.translating .status-indicator {
        background: #f57c00;
        animation: pulse 1s infinite;
      }

      .status.success .status-indicator {
        background: #388e3c;
      }

      .status.error .status-indicator {
        background: #c62828;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .confidence-badge {
        display: inline-block;
        background: #e8f5e9;
        color: #388e3c;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
        margin-left: 8px;
      }

      .swap-languages {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border: 2px solid #ddd;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: -22px;
      }

      .swap-languages:hover {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      @media (max-width: 768px) {
        .translator-section {
          grid-template-columns: 1fr;
        }

        .language-pair {
          grid-template-columns: 1fr;
        }

        .swap-languages {
          display: none;
        }
      }

      .history {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #ddd;
      }

      .history-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 15px;
        font-size: 16px;
      }

      .history-item {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 4px solid #667eea;
      }

      .history-item small {
        color: #999;
        font-size: 12px;
      }

      .history-text {
        color: #333;
        font-size: 13px;
        margin-top: 4px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌐 Translation Demo</h1>
      <p class="subtitle">Real-time text translation using vcall-seamless API</p>

      <div class="config-section">
        <div class="config-group">
          <label for="apiKey">API Key</label>
          <input type="text" id="apiKey" placeholder="Your API key here" />
        </div>

        <div class="config-group">
          <label for="apiHost">API Host</label>
          <input type="text" id="apiHost" value="https://sdk.verbum.ai" />
        </div>

        <div class="config-group">
          <label>Language Pair</label>
          <div class="language-pair">
            <div>
              <label for="sourceLanguage" style="font-size: 12px; color: #999">Source Language</label>
              <select id="sourceLanguage">
                <option value="">Auto-detect</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="zh">Chinese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
              </select>
            </div>
            <div>
              <label for="targetLanguage" style="font-size: 12px; color: #999">Target Language</label>
              <select id="targetLanguage">
                <option value="es">Spanish</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="zh">Chinese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div id="status" class="status idle">
        <span class="status-indicator"></span>
        <span>Ready to translate...</span>
      </div>

      <div class="translator-section">
        <div class="translator-panel">
          <div class="panel-title">Original Text</div>
          <textarea
            id="sourceText"
            placeholder="Enter text to translate..."
          ></textarea>
          <div class="button-group">
            <button class="btn-primary" id="translateBtn" onclick="translateText()">Translate</button>
            <button class="btn-secondary" onclick="clearSource()">Clear</button>
          </div>
        </div>

        <div class="translator-panel">
          <div class="panel-title">Translated Text</div>
          <textarea id="targetText" readonly placeholder="Translation will appear here..."></textarea>
          <div class="button-group">
            <button class="btn-secondary" onclick="copyTranslation()">Copy</button>
          </div>
        </div>
      </div>

      <div class="history">
        <div class="history-title">Recent Translations</div>
        <div id="historyContainer"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
