<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vcall-seamless Text Analysis Browser Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 14px;
        opacity: 0.9;
      }

      .content {
        padding: 40px;
      }

      .config-section {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .config-group {
        margin-bottom: 15px;
      }

      .config-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
      }

      .feature-btn {
        padding: 10px 16px;
        border: 2px solid #ddd;
        border-radius: 6px;
        background: white;
        color: #333;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .feature-btn:hover {
        border-color: #667eea;
        color: #667eea;
      }

      .feature-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        min-height: 150px;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-primary {
        background: #667eea;
        color: white;
        flex: 1;
      }

      .btn-primary:hover:not(:disabled) {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #e0e0e0;
        color: #333;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #d0d0d0;
      }

      .status {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status.idle {
        background: #e3f2fd;
        color: #1976d2;
      }

      .status.analyzing {
        background: #fff3e0;
        color: #f57c00;
      }

      .status.success {
        background: #e8f5e9;
        color: #388e3c;
      }

      .status.error {
        background: #ffebee;
        color: #c62828;
      }

      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .status.analyzing .status-indicator {
        background: #f57c00;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .results {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #ddd;
      }

      .results-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 20px;
        font-size: 16px;
      }

      .result-section {
        margin-bottom: 30px;
      }

      .section-title {
        font-weight: 600;
        color: #667eea;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e0e0e0;
        font-size: 14px;
        text-transform: uppercase;
      }

      .result-item {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 8px;
        border-left: 4px solid #667eea;
      }

      .result-item:last-child {
        margin-bottom: 0;
      }

      .sentiment-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 8px;
      }

      .sentiment-positive {
        background: #c8e6c9;
        color: #2e7d32;
      }

      .sentiment-negative {
        background: #ffcccc;
        color: #c62828;
      }

      .sentiment-neutral {
        background: #e0e0e0;
        color: #424242;
      }

      .entity-type {
        display: inline-block;
        background: #667eea;
        color: white;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 6px;
      }

      .pii-item {
        background: #ffcccc;
        padding: 8px 12px;
        border-radius: 4px;
        margin-bottom: 6px;
        color: #c62828;
        font-family: 'Monaco', monospace;
        font-size: 13px;
      }

      @media (max-width: 600px) {
        .header {
          padding: 20px;
        }

        h1 {
          font-size: 24px;
        }

        .content {
          padding: 20px;
        }

        .features {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📝 Text Analysis Demo</h1>
        <p class="subtitle">Sentiment, entities, and PII detection using vcall-seamless API</p>
      </div>

      <div class="content">
        <div class="config-section">
          <div class="config-group">
            <label for="apiKey">API Key</label>
            <input type="text" id="apiKey" placeholder="Your API key here" />
          </div>

          <div class="config-group">
            <label for="apiHost">API Host</label>
            <input type="text" id="apiHost" value="https://sdk.verbum.ai" />
          </div>

          <div class="config-group">
            <label>Analysis Features</label>
            <div class="features">
              <button class="feature-btn active" onclick="toggleFeature(this, 'sentiment')">
                😊 Sentiment
              </button>
              <button class="feature-btn" onclick="toggleFeature(this, 'entities')">
                🏷️ Entities
              </button>
              <button class="feature-btn" onclick="toggleFeature(this, 'redact')">
                🔒 PII Redact
              </button>
            </div>
          </div>
        </div>

        <div id="status" class="status idle">
          <span class="status-indicator"></span>
          <span>Ready to analyze...</span>
        </div>

        <div class="config-group">
          <label for="textInput">Text to Analyze</label>
          <textarea
            id="textInput"
            placeholder="Enter text to analyze... For example: 'I love this product! Contact John at john@example.com'"
          ></textarea>
          <div class="button-group">
            <button class="btn-primary" id="analyzeBtn" onclick="analyzeText()">Analyze</button>
            <button class="btn-secondary" onclick="clearText()">Clear</button>
          </div>
        </div>

        <div id="results" class="results" style="display: none">
          <div class="results-title">Analysis Results</div>
          <div id="resultsContent"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
