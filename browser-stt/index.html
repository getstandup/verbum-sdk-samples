<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vcall-seamless STT Browser Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 800px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .config-section {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .config-group {
        margin-bottom: 15px;
      }

      .config-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input[type='text'],
      input[type='file'],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
      }

      input[type='text']:focus,
      input[type='file']:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-primary {
        background: #667eea;
        color: white;
        flex: 1;
      }

      .btn-primary:hover:not(:disabled) {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #e0e0e0;
        color: #333;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #d0d0d0;
      }

      .output-section {
        margin-top: 30px;
      }

      .output-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid #667eea;
      }

      .status {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status.connecting {
        background: #e3f2fd;
        color: #1976d2;
      }

      .status.connected {
        background: #e8f5e9;
        color: #388e3c;
      }

      .status.transcribing {
        background: #fff3e0;
        color: #f57c00;
      }

      .status.error {
        background: #ffebee;
        color: #c62828;
      }

      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .status.connecting .status-indicator {
        background: #1976d2;
        animation: pulse 1.5s infinite;
      }

      .status.connected .status-indicator {
        background: #388e3c;
      }

      .status.transcribing .status-indicator {
        background: #f57c00;
        animation: pulse 1s infinite;
      }

      .status.error .status-indicator {
        background: #c62828;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .transcript-box {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 15px;
        min-height: 100px;
        max-height: 300px;
        overflow-y: auto;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 13px;
        line-height: 1.6;
      }

      .interim-transcript {
        color: #999;
        font-style: italic;
      }

      .final-transcript {
        color: #333;
      }

      .results {
        background: #f5f5f5;
        border-radius: 6px;
        padding: 16px;
        margin-top: 15px;
      }

      .result-item {
        padding: 10px;
        background: white;
        border-radius: 4px;
        margin-bottom: 10px;
        border-left: 4px solid #667eea;
      }

      .result-item:last-child {
        margin-bottom: 0;
      }

      .result-label {
        font-weight: 600;
        color: #667eea;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .result-value {
        color: #333;
        font-size: 14px;
        word-break: break-word;
      }

      .confidence {
        display: inline-block;
        background: #e8f5e9;
        color: #388e3c;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        margin-left: 8px;
      }

      .checkbox-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
      }

      input[type='checkbox'] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        margin-right: 8px;
      }

      .checkbox-item label {
        margin: 0;
        font-weight: 400;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }

        h1 {
          font-size: 24px;
        }

        .controls {
          flex-direction: column;
        }

        .checkbox-group {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎤 Speech-to-Text Demo</h1>
      <p class="subtitle">Real-time transcription using vcall-seamless API</p>

      <div class="config-section">
        <div class="config-group">
          <label for="apiKey">API Key</label>
          <input type="text" id="apiKey" placeholder="Your API key here" />
        </div>

        <div class="config-group">
          <label for="apiHost">API Host</label>
          <input type="text" id="apiHost" value="https://sdk.verbum.ai" />
        </div>

        <div class="config-group">
          <label for="language">Language</label>
          <select id="language">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="it-IT">Italian</option>
            <option value="pt-BR">Portuguese (Brazil)</option>
            <option value="zh-CN">Mandarin Chinese</option>
            <option value="ja-JP">Japanese</option>
            <option value="ko-KR">Korean</option>
          </select>
        </div>

        <div class="config-group">
          <label for="audioFile">Audio File</label>
          <input type="file" id="audioFile" accept="audio/*" />
        </div>

        <div class="config-group">
          <label>Features</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="diarization" />
              <label for="diarization">Speaker Diarization</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="sentiment" />
              <label for="sentiment">Sentiment Analysis</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="redact" />
              <label for="redact">PII Redaction</label>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn" onclick="startTranscription()">Start Transcription</button>
        <button class="btn-secondary" id="stopBtn" onclick="stopTranscription()" disabled>Stop</button>
        <button class="btn-secondary" id="clearBtn" onclick="clearTranscript()">Clear</button>
      </div>

      <div class="output-section">
        <div class="output-title">Status</div>
        <div id="status" class="status connecting">
          <span class="status-indicator"></span>
          <span>Ready to connect...</span>
        </div>
      </div>

      <div class="output-section">
        <div class="output-title">Transcript</div>
        <div class="transcript-box">
          <div id="interimTranscript" class="interim-transcript"></div>
          <div id="finalTranscript" class="final-transcript"></div>
        </div>
      </div>

      <div class="output-section" id="resultsSection" style="display: none">
        <div class="output-title">Analysis Results</div>
        <div id="results" class="results"></div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
